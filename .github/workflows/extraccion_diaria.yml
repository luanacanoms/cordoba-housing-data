name: Extraccion Diaria Idealista Cordoba

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  extraer-datos:
    runs-on: ubuntu-latest
    
    # Adiciona a permissão necessária para o 'git push' funcionar
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pandas

      - name: Ejecutar script de extraccion
        env:
          IDEALISTA_API_KEY: ${{ secrets.IDEALISTA_API_KEY }}
          IDEALISTA_API_SECRET: ${{ secrets.IDEALISTA_API_SECRET }}
        run: python scripts/extraer_datos.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Altera para rastrear todos os CSVs novos ou modificados na raiz do repositório
          git add *.csv
          
          git diff --staged --quiet || git commit -m "Actualizacion automatica de datos - $(date +'%Y-%m-%d')"
          git push
